name: Engineering verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows engineering gates (no live certification)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      UV_FROZEN: 'true'
      CHOICEMIND_RUNTIME: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.21.0
      - name: Prepare pinned Corepack pnpm for offline command tests
        run: corepack install --global pnpm@11.21.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.19'
          python-version: '3.14.6'
          enable-cache: false
      - name: Install locked dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project services/data-worker --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install browser for synthetic UI tests
        run: pnpm --filter @choicemind/web exec playwright install chromium
      - name: Build clean checkout before runtime imports
        run: pnpm build
      - name: Verify
        run: pnpm verify
      - name: Report evidence boundary
        if: always()
        shell: pwsh
        run: |
          @'
          ## Evidence boundary
          This job checks the exact checkout with frozen dependency locks.
          It runs the repository engineering command, including synthetic browser tests.
          It does not certify live Providers, platform credentials, PostgreSQL integration,
          candidate Docker execution, or Alpha product acceptance. Skipped tests are not passes.
          '@ | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  candidate-identity:
    name: Candidate identity (isolated PostgreSQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: candidate_test
          POSTGRES_PASSWORD: synthetic_test_only
          POSTGRES_DB: candidate_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U candidate_test -d candidate_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm and locked dependencies
        run: |
          npm install --global pnpm@11.21.0
          pnpm install --frozen-lockfile
      - name: Build API dependency closure
        run: pnpm --filter @choicemind/api... build
      - name: Verify real Cookie authorization with synthetic accounts
        env:
          CHOICEMIND_TEST_DATABASE_URL: postgresql://candidate_test:synthetic_test_only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/candidate_test
        run: pnpm --filter @choicemind/api exec vitest run tests/integration/candidate-identity.test.ts
