name: Engineering verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows engineering gates (no live certification)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      UV_FROZEN: 'true'
      CHOICEMIND_RUNTIME: fake
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.21.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.11.19'
          python-version: '3.14.6'
          enable-cache: false
      - name: Install locked dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --project services/data-worker --frozen
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install browser for synthetic UI tests
        run: pnpm --filter @choicemind/web exec playwright install chromium
      - name: Build clean checkout before runtime imports
        run: pnpm build
      - name: Verify
        run: pnpm verify
      - name: Report evidence boundary
        if: always()
        shell: pwsh
        run: |
          @'
          ## Evidence boundary
          This job checks the exact checkout with frozen dependency locks.
          It runs the repository engineering command, including synthetic browser tests.
          It does not certify live Providers, platform credentials, PostgreSQL integration,
          candidate Docker execution, or Alpha product acceptance. Skipped tests are not passes.
          '@ | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
