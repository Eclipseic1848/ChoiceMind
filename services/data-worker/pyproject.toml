[project]
name = "choicemind-data-worker"
version = "0.0.0"
requires-python = "==3.14.6"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.1"
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.16.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = false
